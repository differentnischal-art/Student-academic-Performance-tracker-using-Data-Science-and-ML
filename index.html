<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Choose Login | Student Performance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fullscreen background video -->
    <video autoplay muted loop id="bg-video">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="left-logo-box">
        <div class="logo-circle">
            <img src="logo.png" class="side-logo">
        </div>
        <h1 class="side-title">Student Performance Tracker</h1>
    </div>


    <!-- Circular right-side UI -->
    <div class="center-image glow-load">

        <div class="container slide-up">
            <h2>Select Login Type</h2>

            <button class="choice" onclick="window.location='student-login.html'">
                Student Login
            </button>

            <button class="choice" onclick="window.location='teacher-login.html'">
                Teacher Login
            </button>
        </div>

    </div>

</body>

</html>
