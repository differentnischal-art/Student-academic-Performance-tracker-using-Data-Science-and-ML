<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Performance Input</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
        }

        .title-bar {
            text-align: center;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #00a2ff;
            text-shadow: 0 0 10px #0077cc;
            margin-bottom: 20px;
        }

        .form-card {
            width: 35%;
            margin: 30px auto;
            background: #000;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            color: #fff;
        }

        @media (max-width: 768px) {
            .form-card {
                width: 90%;
                padding: 20px;
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Header lines and test text */
        .card-header h2 {
            margin: 10px 0;
            font-size: 22px;
            color: #fff; /* white test text */
            position: relative;
        }

        .card-header h2::before,
        .card-header h2::after {
            content: "";
            display: block;
            width: 80%; /* longer line */
            height: 2px;
            background: #fff; /* white line */
            margin: 8px auto;
        }

        .card-header p {
            margin: 5px 0 0;
            font-size: 16px;
            color: #ccc;
        }

        form label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        form input, form select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 2px solid #555;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
        }

        /* Manual inputs: white background, black text */
        form input {
            background: #fff;
            color: #000;
        }

        form input::placeholder {
            color: #888;
        }

        /* Dropdowns: white background, black text */
        form select {
            background: #fff;
            color: #000;
        }

        form input:focus, form select:focus {
            border-color: #00a2ff;
            box-shadow: 0 0 5px #00a2ff;
            outline: none;
        }

        /* Remove number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background: #00a2ff;
            color: #000;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #0077cc;
            color: #fff;
        }

    </style>
</head>
<body>

    <h1 class="title-bar">Student Performance Prediction</h1>

    <div class="form-card">

        <div class="card-header">
            <h2>-TEST-</h2>
            <p>STUDENT DETAILS</p>
        </div>

        <form>

            <!-- Dropdowns -->
            <label>Branch</label>
            <select>
                <option value="" disabled selected>Select Branch</option>
                <option>AIDS (CS DS)</option>
                <option>CSE</option>
                <option>ISE</option>
                <option>ECE</option>
                <option>AIML (CS ML)</option>
            </select>

            <label>Semester</label>
            <select>
                <option value="" disabled selected>Select Semester</option>
                <option>3rd</option>
            </select>

            <!-- Manual inputs -->
            <label>Attendance Percentage</label>
            <input type="number" placeholder="Enter Attendance %">

            <label>Study Hours Per Day</label>
            <input type="number" placeholder="Enter Study Hours">

            <label>CIE Marks (Out of 50)</label>
            <input type="number" placeholder="Enter CIE Marks">

            <label>Sleep Hours</label>
            <input type="number" placeholder="Enter Sleep Hours">

            <label>Screen Time (Hours)</label>
            <input type="number" placeholder="Enter Screen Time Hours">

            <label>Coding Skill (1–5)</label>
            <input type="number" placeholder="Enter Coding Skill">

            <label>Participates in Events (Yes/No)</label>
            <input type="text" placeholder="Yes or No">

            <label>Parental Support (1–5)</label>
            <input type="number" placeholder="Enter Level">

            <label>Motivation (1–5)</label>
            <input type="number" placeholder="Enter Motivation">

            <label>Current SGPA</label>
            <input type="number" placeholder="Enter SGPA">

            <label>Branch Category</label>
            <input type="text" placeholder="Enter Branch Category">

            <label>Semester Category</label>
            <input type="text" placeholder="Enter Semester Category">

            <button class="submit-btn">Submit</button>

        </form>

    </div>

</body>
</html>
